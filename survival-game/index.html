<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HEX SURVIVAL</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- =====================================================
       スタート画面
  ====================================================== -->

  <div id="title" class="start-screen">

    <div class="start-card">

      <h1>HEX SURVIVAL</h1>

      <p>
        ゲートを探して、生き延びろ。
      </p>

      <button
        id="start"
        class="primary-btn"
      >
        START
      </button>

    </div>

  </div>


  <!-- =====================================================
       ゲーム本体
  ====================================================== -->

  <div id="game" hidden>

    <!-- ===================================================
         上部ステータス
    ==================================================== -->

    <header class="topbar">

      <div class="day-card">
        <div>
          Day
          <span id="day">1</span>
        </div>
      </div>

      <div
        id="resources"
        class="resources"
      ></div>

      <button
        id="bookBtn"
        class="menu-btn"
        type="button"
        aria-label="食材図鑑"
      >
        <img
          src="images/UI/book.png"
          alt=""
        >
      </button>
<button id="testGateCutscene" type="button">
  ゲート演出テスト
</button>

    </header>


    <!-- ===================================================
         キャラクター・ステータス
    ==================================================== -->

    <section class="status-area">
      <!-- 空腹度とライフエリア-->
      <div class="status-row">
        <div class="status-card">
          <div class="status-title">
            <div class="status-label">
              <img class="status-icon" src="images/UI/hunger.png" alt="空腹度">
              <span>空腹度</span>
            </div>
            <b id="hungerText"></b>
          </div>
          <div class="bar">
            <i id="hungerBar"></i>
          </div>
        </div>

        <div class="status-card">
          <div class="status-title">
            <div class="status-label">
              <img class="status-icon" src="images/UI/life.png" alt="ライフ">
              <span>ライフ</span>
            </div>
            <b id="lifeText"></b>
          </div>
          <div class="bar life">
            <i id="lifeBar"></i>
          </div>
        </div>
      </div>

      <div id="characterArea" class="character-area">

        <div class="eat-control">

          <button
            id="eat"
            class="eat-button"
            type="button"
            aria-label="食べる"
          >
            <img
              src="images/UI/eat.png"
              alt=""
            >
          </button>

          <div class="eat-food-count">
            <img
              src="images/UI/materials_food.png"
              alt="食料"
            >
            <span id="food">0</span>
          </div>
        </div>

        <div class="character-display">

          <img
            id="char"
            src="images/character_idle1.png"
            alt="主人公"
          >

          <div
            id="discoveryMark"
            class="discovery-mark"
            hidden
          >
            !
          </div>

        </div>

      <button
        id="exploreSign"
        class="explore-sign-button"
        type="button"
        aria-label="探検へ"
      >
        <img
          src="images/UI/explore_sign.png"
          alt=""
        >
      </button>

      </div>

    </section>


    <!-- ===================================================
         メイン
    ==================================================== -->

    <main>


      <!-- =================================================
           拠点画面
      ================================================== -->

      <div
        id="baseView"
        class="game-view"
      >

        <section class="base-panel">

          <div class="section-head">

            <h2>
              拠点施設
            </h2>

            <span class="section-note">施設を選んで開発</span>

          </div>

          <div
            id="facilities"
            class="facility-grid"
          ></div>

        </section>

        <!-- 探索ログ -->
        <section class="log-panel">

          <div class="section-head">

            <h2>
              探索ログ
            </h2>

            <button id="clearLog">
              消去
            </button>

          </div>

          <div id="log"></div>

        </section>

      </div>


      <!-- =================================================
           探索画面
      ================================================== -->

      <div
        id="exploreView"
        class="game-view"
        hidden
      >

        <section class="map-panel">

          <div class="section-head">

            <h2>
              🧭 探索マップ
            </h2>

            <button id="backToBase">
              🏠 拠点に戻る
            </button>

          </div>

          <div class="explore-help">
            探索済みマスに隣接するマスを探索できます
          </div>

          <div
            id="map"
            class="hex-map"
          ></div>

        </section>

      </div>


    </main>

  </div>


  <!-- =====================================================
       探索確認モーダル
  ====================================================== -->

  <div
    id="exploreModal"
    class="modal-backdrop"
    hidden
  >

    <div class="explore-modal">

      <div class="modal-head">

        <div>

          <small>
            探索先の確認
          </small>

          <h2 id="exploreTitle"></h2>

        </div>

        <button
          id="modalClose"
          class="modal-close"
        >
          ×
        </button>

      </div>


      <div
        id="explorePreview"
        class="explore-preview"
      ></div>

      <div class="preview-section">

        <h3>
          獲得予想
        </h3>

        <div
          id="resourcePreview"
          class="resource-preview"
        ></div>

        <p class="preview-note">
        </p>

      </div>


      <div class="modal-actions">

        <button
          id="cancelExplore"
          class="secondary-btn"
        >
          やめる
        </button>

        <button
          id="confirmExplore"
          class="primary-btn"
        >
          ここを探索する
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       施設確認モーダル
  ====================================================== -->

  <div
    id="facilityModal"
    class="modal-backdrop"
    hidden
  >

    <div class="explore-modal wide">

      <div class="modal-head">

        <h2 id="facilityTitle">施設</h2>

        <button
          id="facilityClose"
          class="modal-close"
        >
          ×
        </button>

      </div>

      <div id="facilityDetail" class="facility-detail"></div>

      <div class="modal-actions">
        <button id="facilityCancel" class="secondary-btn">
          キャンセル
        </button>
        <button id="facilityUpgradeBtn" class="primary-btn">
          レベルアップ
        </button>
      </div>

    </div>

  </div>


  <!-- =====================================================
       食材図鑑モーダル
  ====================================================== -->

  <div
    id="bookModal"
    class="modal-backdrop"
    hidden
  >

    <div class="explore-modal wide">

      <div class="modal-head">

        <h2>
          食材図鑑
        </h2>

        <button
          class="modalClose2 modal-close"
        >
          ×
        </button>

      </div>

      <div
        id="book"
        class="book-grid"
      ></div>

    </div>

  </div>

<!-- =====================================================
     探索結果モーダル
====================================================== -->
  <div
    id="exploreResultModal"
    class="modal-backdrop"
    hidden
  >
    <div class="explore-modal">

      <div class="modal-head">
        <div>
          <small>探索終了</small>
          <h2>見つけたもの</h2>
        </div>
      </div>

      <div
        id="exploreResultDetail"
        class="explore-result-detail"
      ></div>

      <div class="modal-actions result-actions">

        <button
          id="exploreResultOk"
          class="primary-btn"
        >
          OK
        </button>

      </div>

    </div>
  </div>

  <!-- トースト -->

  <div
    id="toast"
    class="toast"
  ></div>


  <script src="app.js"></script>

  <!-- =====================================================
      スクラップブックイベント　ラストイベント
  ===================================================== -->
  <div
    id="gateCutsceneOverlay"
    class="story-cutscene-overlay"
    hidden
  >
    <div
      id="gateScrapbook"
      class="story-scrapbook"
    >

      <div
        id="gateCutLayer"
        class="story-cut-layer"
      ></div>

      <div class="story-cut-guide">
        タップして続ける
      </div>

    </div>
  </div>

</body>
</html>
