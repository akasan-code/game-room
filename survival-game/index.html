<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEX SURVIVAL</title><link rel="stylesheet" href="style.css"></head><body>
<div id="title" class="start-screen"><div class="start-card"><h1>HEX SURVIVAL</h1><p>秘宝を探して、生き延びろ。</p><button id="start" class="primary-btn">START</button></div></div>
<div id="game" hidden><header class="topbar"><div class="day-card"><div>Day <span id="day">1</span></div></div><div id="resources" class="resources"></div><button id="bookBtn" class="menu-btn">📖</button></header>
<section class="status-row"><button id="eat" class="character"><div id="char">👨‍💼</div><small>クリックで食べる</small></button><div class="status-card"><div class="status-title">🍖 空腹度 <b id="hungerText"></b></div><div class="bar"><i id="hungerBar"></i></div><small>探索すると減少</small></div><div class="status-card"><div class="status-title">❤️ ライフ <b id="lifeText"></b></div><div class="bar life"><i id="lifeBar"></i></div><small>0でゲームオーバー</small></div></section>
<main><section class="map-panel"><div class="section-head"><h2>探索マップ</h2><span>隣接マスをタップ</span></div><div id="map" class="hex-map"></div></section><section class="log-panel"><div class="section-head"><h2>探索ログ</h2><button id="clearLog">消去</button></div><div id="log"></div></section><section class="base-panel"><div class="section-head"><h2>拠点施設</h2><button id="buildBtn">🔨 開発</button></div><div id="facilities" class="facility-grid"></div></section></main></div>
<div id="exploreModal" class="modal-backdrop" hidden><div class="explore-modal"><div class="modal-head"><div><small>探索先の確認</small><h2 id="exploreTitle"></h2></div><button id="modalClose" class="modal-close">×</button></div><div id="explorePreview" class="explore-preview"></div><div class="preview-section"><h3>消費・危険</h3><div id="travelCost" class="preview-row"></div></div><div class="preview-section"><h3>獲得予想</h3><div id="resourcePreview" class="resource-preview"></div><p class="preview-note">レア素材は10%で入手。</p></div><div class="modal-actions"><button id="cancelExplore" class="secondary-btn">やめる</button><button id="confirmExplore" class="primary-btn">ここを探索する</button></div></div></div>
<div id="buildModal" class="modal-backdrop" hidden><div class="explore-modal wide"><div class="modal-head"><h2>施設開発</h2><button class="modalClose2 modal-close">×</button></div><div id="buildList"></div></div></div>
<div id="bookModal" class="modal-backdrop" hidden><div class="explore-modal wide"><div class="modal-head"><h2>食材図鑑</h2><button class="modalClose2 modal-close">×</button></div><div id="book" class="book-grid"></div></div></div><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
