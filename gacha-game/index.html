<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summon Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="screen">
    <img class="layer background" src="assets/background.png" alt="">
    <div class="vignette"></div>

    <section class="hud">
      <div class="title">召喚</div>
      <div class="currency">
        <span class="gem red"></span><b>2,350</b>
        <span class="gem blue"></span><b>1,580</b>
        <span class="gem gold"></span><b>890</b>
      </div>
    </section>

    <aside class="side-menu">
      <button>提供割合</button>
      <button>履歴</button>
    </aside>

    <section class="summon-stage" id="summonStage">
      <img class="layer pillars" src="assets/pillars.png" alt="">
      <img class="layer ring" src="assets/upper_ring.png" alt="">
      <img class="layer platform" src="assets/platform.png" alt="">
      <img class="layer aura" src="assets/orb_aura.png" alt="">
      <img class="layer orb" src="assets/orb.png" alt="">
      <img class="layer orb-crack" id="orbCrack" src="" alt="" aria-hidden="true">
      <img class="layer lower-fx" src="assets/lower_fx.png" alt="">
      <div class="flash"></div>
      <div class="summon-glow"></div>
      <div class="reveal-burst" id="revealBurst" aria-hidden="true">
        <div class="reveal-burst-rays"></div>
        <div class="reveal-burst-ring ring-a"></div>
        <div class="reveal-burst-ring ring-b"></div>
        <div class="reveal-burst-core"></div>
      </div>
    </section>

    <div class="tap-text" id="tapText">✦ 召喚ボタンを選択 ✦</div>

    <section class="summon-actions">
      <button class="summon-btn single" data-count="1">
        <span>1回召喚</span>
        <small>◆ 300</small>
      </button>
      <button class="summon-btn ten" data-count="12">
        <span>12回召喚</span>
        <small>◆ 3,600</small>
      </button>
    </section>

    <nav class="bottom-nav">
      <span>ホーム</span><span>キャラ</span><span>バトル</span>
      <span class="active">召喚</span><span>ショップ</span><span>メニュー</span>
    </nav>

    
    <div class="card-eject-layer" id="cardEjectLayer" aria-hidden="true">
      <div class="layered-card eject-card" id="ejectCard">
        <img class="card-frame-sizing" id="ejectFrameSizing" src="assets/card_frame_sr.png" alt="">
        <div class="card-art-window">
          <img class="card-character" id="ejectCharacter" src="assets/sample_character.png" alt="キャラクター">
        </div>
        <img class="card-frame-overlay" id="ejectFrameOverlay" src="assets/card_frame_sr.png" alt="">
        <div class="card-rarity-label" id="ejectRarity">N</div>
        <div class="card-nameplate">
          <div class="card-name" id="ejectName">星導の魔導姫</div>
        </div>
      </div>
    </div>

    

    <!-- 取得カード専用：カード枠DOMとは完全に独立 -->
    <div class="acquisition-reveal" id="acquisitionReveal" aria-hidden="true">
      <div class="acquisition-backdrop"></div>
      <img
        class="acquisition-character"
        id="acquisitionCharacter"
        src=""
        alt="取得キャラクター"
      >
      <div class="acquisition-rarity" id="acquisitionRarity"></div>
      <div class="acquisition-tap-guide" id="acquisitionTapGuide">TAP</div>
    </div>

    <div class="result-card" id="resultCard">
      <div class="result-inner">

        <div class="single-result" id="singleResult">
          <div class="result-rarity" id="resultRarity">N</div>

          <div class="layered-card result-layered-card" id="resultLayeredCard">
            <img class="card-frame-sizing" id="resultFrameSizing" src="assets/card_frame_sr.png" alt="">
            <div class="card-art-window">
              <img class="card-character" id="resultCharacter" src="assets/sample_character.png" alt="キャラクター">
            </div>
            <img class="card-frame-overlay" id="resultFrameOverlay" src="assets/card_frame_sr.png" alt="">
            <div class="card-rarity-label" id="resultCardRarity">N</div>
            <div class="card-nameplate">
              <div class="card-name" id="resultCardName">星導の魔導姫</div>
            </div>
          </div>

          <div class="result-title">召喚成功</div>
        </div>

        <div class="ten-result" id="tenResult">
          <div class="ten-result-title">12連召喚結果</div>
          <div class="ten-card-grid" id="tenCardGrid"></div>
        </div>

        <button id="closeResult">閉じる</button>
      </div>
    </div>

  </main>
  <script src="script.js"></script>
</body>
</html>
